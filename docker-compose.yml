version: '3.8'

services:
  optix-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optix_medical_app
    ports:
      - "8501:8501"
    volumes:
      # Проброс папок для сохранения обученных моделей и отчетов на хост-машине
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
      - ./configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
